name: Veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Server-Version bauen (Prüfung)
        run: npm run build:server
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # KI-Schlüssel gehören NICHT hierher: jede Person trägt ihren eigenen Schlüssel nur auf dem
      # eigenen Gerät ein. Der Build bekommt deshalb absichtlich keine Secrets.
      - name: Keine Schlüssel in der Webseite
        run: |
          if grep -rEl "AIza[0-9A-Za-z_-]{30,}|sk-or-v1-[0-9a-f]{20,}" out; then echo "::error::Im Build steckt etwas, das wie ein KI-Schlüssel aussieht."; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
