name: Veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  # Pull requests run all checks too, but are not published.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Build (also for pull requests) only reads; publishing rights only in the deploy job.
permissions:
  contents: read

# Own group per pull request; a running publication is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bekannte Sicherheitslücken in Paketen
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Server-Version bauen (Prüfung)
        run: npm run build:server
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      # KI-Schlüssel gehören NICHT hierher: jede Person trägt ihren eigenen Schlüssel nur auf dem
      # eigenen Gerät ein. Der Build bekommt deshalb absichtlich keine Secrets.
      - name: Keine Schlüssel in der Webseite
        run: |
          if grep -rEl "AIza[0-9A-Za-z_-]{30,}|sk-or-v1-[0-9a-f]{20,}" out; then echo "::error::Im Build steckt etwas, das wie ein KI-Schlüssel aussieht."; exit 1; fi
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
